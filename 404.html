<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada · 3D Catálogo</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6faf9; --surface:#fff; --ink:#10201d; --ink-2:#4a5d59; --ink-3:#8a9a97; --line:#e1ebe8;
    --accent:#14b8a6; --accent-ink:#0f766e; --accent-soft:#ccfbf1; --accent-softer:#effdfa;
    --printer:#ffffff; --printer-line:#1f2f2c; --chamber:#e6f4f1; --screen:#10201d;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0c1715; --surface:#13221f; --ink:#e8f3f1; --ink-2:#a9bdb8; --ink-3:#6f8783; --line:#22332f;
      --accent:#2dd4bf; --accent-ink:#5eead4; --accent-soft:#134e48; --accent-softer:#10302c;
      --printer:#1b2d29; --printer-line:#cfe3de; --chamber:#0f2622; --screen:#061210; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px;-webkit-font-smoothing:antialiased}
  .wrap{width:100%;max-width:760px;text-align:center}
  .brand{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;color:var(--ink);text-decoration:none;margin-bottom:10px}
  .brand-mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#2dd4bf,#0ea5a4);display:grid;place-items:center}
  .brand-mark svg{width:18px;height:18px}
  .scene{width:100%;max-width:640px;height:auto;display:block;margin:0 auto}
  .code{display:inline-block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.75rem;letter-spacing:.06em;
    color:var(--accent-ink);background:var(--accent-softer);border:1px solid var(--accent-soft);padding:4px 10px;border-radius:999px;margin-top:6px}
  h1{font-size:clamp(1.6rem,4.6vw,2.5rem);line-height:1.1;letter-spacing:-.03em;font-weight:800;margin-top:14px}
  h1 span{background:linear-gradient(90deg,#0d9488,#14b8a6 60%,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent}
  p.sub{color:var(--ink-2);margin:12px auto 0;max-width:46ch;font-size:1rem;line-height:1.55}
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
  .btn{height:48px;padding:0 20px;border-radius:12px;font-weight:700;font-size:.95rem;display:inline-flex;align-items:center;gap:8px;
    text-decoration:none;transition:transform .2s,background .2s}
  .btn:hover{transform:translateY(-2px)}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 10px 22px -12px rgba(20,184,166,.9)}
  .btn-wa{background:#25d366;color:#08331a}
  .btn svg{width:18px;height:18px}
  footer{margin-top:28px;color:var(--ink-3);font-size:.8rem}

  /* ---------- Animaciones ---------- */
  .bob{animation:bob 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
  @keyframes bob{50%{transform:translateY(-4px)}}
  .arm-hit{animation:hit 1.2s cubic-bezier(.5,0,.3,1) infinite;transform-origin:184px 268px}
  @keyframes hit{0%,100%{transform:rotate(-38deg)}45%{transform:rotate(14deg)}55%{transform:rotate(10deg)}}
  .arm-wave{animation:wave 2.4s ease-in-out infinite;transform-origin:116px 268px}
  @keyframes wave{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-14deg)}}
  .spark{opacity:0;animation:spark 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
  @keyframes spark{0%,42%{opacity:0;transform:scale(.3)}47%{opacity:1;transform:scale(1.1)}62%{opacity:0;transform:scale(1.5)}100%{opacity:0}}
  .shake{animation:shake 1.2s linear infinite}
  @keyframes shake{0%,44%,60%,100%{transform:translateX(0)}47%{transform:translateX(3px)}51%{transform:translateX(-2px)}55%{transform:translateX(1px)}}
  .blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
  @keyframes blink{0%,44%,50%,100%{transform:scaleY(1)}47%{transform:scaleY(.1)}}
  .antenna{animation:led 1.2s steps(1) infinite}
  @keyframes led{0%,50%{fill:#f59e0b}51%,100%{fill:#fde68a}}
  .led{animation:ledr .8s steps(1) infinite}
  @keyframes ledr{0%,50%{fill:#ef4444}51%,100%{fill:#7f1d1d}}
  .spool{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}
  @keyframes spin{to{transform:rotate(360deg)}}
  .screw{animation:screw 2.4s cubic-bezier(.3,0,.5,1) infinite;transform-box:fill-box;transform-origin:center}
  @keyframes screw{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(-14px,-34px) rotate(-120deg)}40%{transform:translate(-26px,0) rotate(-240deg)}52%{transform:translate(-32px,-10px) rotate(-300deg)}64%{transform:translate(-36px,0) rotate(-360deg)}}
  .bubble{animation:pop 4.8s ease-in-out infinite;transform-box:fill-box;transform-origin:20% 100%}
  @keyframes pop{0%,8%{opacity:0;transform:scale(.6)}14%,86%{opacity:1;transform:scale(1)}94%,100%{opacity:0;transform:scale(.8)}}
  .puff{animation:puff 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
  .puff.d2{animation-delay:.9s}.puff.d3{animation-delay:1.7s}
  @keyframes puff{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:.7}100%{opacity:0;transform:translateY(-36px) scale(1.4)}}
  .float{animation:float 3s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-6px)}}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important} }
</style>
</head>
<body>
<main class="wrap">
  <a class="brand" id="home1" href="./" aria-label="3D Catálogo, inicio">
    <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="m3 7 9 5 9-5M12 12v10"/></svg></span>
    3D Catálogo
  </a>

  <svg class="scene" id="scene" viewBox="0 0 600 420" role="img" aria-label="Un robot pequeño repara con una llave una impresora 3D que está imprimiendo el número 404">
    <defs>
      <clipPath id="printClip">
        <rect x="262" y="272" width="176" height="0">
          <animate attributeName="y" values="272;196;196;272" keyTimes="0;.72;.92;1" dur="8s" repeatCount="indefinite"/>
          <animate attributeName="height" values="0;76;76;0" keyTimes="0;.72;.92;1" dur="8s" repeatCount="indefinite"/>
        </rect>
      </clipPath>
      <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
        <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
      <pattern id="layers" width="4" height="4" patternUnits="userSpaceOnUse">
        <rect width="4" height="4" fill="#14b8a6"/><rect y="3" width="4" height="1" fill="#0f766e" opacity=".45"/>
      </pattern>
    </defs>

    <!-- piso y sombras -->
    <line x1="30" y1="362" x2="570" y2="362" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="350" cy="364" rx="130" ry="9" fill="#10201d" opacity=".08"/>
    <ellipse cx="150" cy="364" rx="52" ry="7" fill="#10201d" opacity=".1"/>

    <!-- carrete de filamento -->
    <g transform="translate(520 150)">
      <rect x="-6" y="0" width="12" height="212" rx="4" fill="var(--printer-line)" opacity=".18"/>
      <g class="spool">
        <circle r="42" fill="#14b8a6"/>
        <circle r="42" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray="4 5" opacity=".6"/>
        <circle r="30" fill="#2dd4bf"/>
        <circle r="13" fill="var(--printer)" stroke="var(--printer-line)" stroke-width="3"/>
        <rect x="-3" y="-30" width="6" height="16" rx="3" fill="#0f766e"/>
      </g>
    </g>
    <path d="M488 136 C 470 96, 420 70, 392 64" fill="none" stroke="#14b8a6" stroke-width="3" stroke-linecap="round"/>

    <!-- impresora -->
    <g class="shake">
      <rect x="226" y="56" width="248" height="306" rx="24" fill="var(--printer)" stroke="var(--printer-line)" stroke-width="4"/>
      <rect x="246" y="86" width="208" height="214" rx="14" fill="var(--chamber)" stroke="var(--printer-line)" stroke-width="3"/>
      <!-- 404 imprimiéndose -->
      <text x="350" y="270" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-weight="800" font-size="78" fill="#14b8a6" opacity=".14">404</text>
      <g clip-path="url(#printClip)">
        <text x="350" y="270" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-weight="800" font-size="78" fill="url(#layers)">404</text>
      </g>
      <!-- cama -->
      <rect x="258" y="272" width="184" height="10" rx="3" fill="#334a45"/>
      <!-- cabezal: sube con las capas y va de lado a lado -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -76;0 -76;0 0" keyTimes="0;.72;.92;1" dur="8s" repeatCount="indefinite"/>
        <rect x="252" y="176" width="196" height="6" rx="3" fill="var(--printer-line)" opacity=".55"/>
        <g>
          <animateTransform attributeName="transform" type="translate" values="282 0;418 0;282 0" dur="1.1s" repeatCount="indefinite"/>
          <rect x="-24" y="166" width="48" height="30" rx="9" fill="#ffffff" stroke="var(--printer-line)" stroke-width="3"/>
          <rect x="-14" y="173" width="28" height="6" rx="3" fill="#14b8a6"/>
          <path d="M-7 196 h14 l-7 10 z" fill="var(--printer-line)"/>
          <circle cx="0" cy="209" r="3" fill="#f97316"><animate attributeName="opacity" values="1;.3;1" dur=".4s" repeatCount="indefinite"/></circle>
        </g>
      </g>
      <!-- vidrio -->
      <rect x="246" y="86" width="208" height="214" rx="14" fill="url(#glass)"/>
      <!-- panel -->
      <rect x="262" y="314" width="112" height="30" rx="8" fill="var(--screen)"/>
      <text x="318" y="334" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#5eead4">ERR 404</text>
      <circle class="led" cx="400" cy="329" r="7" fill="#ef4444"/>
      <circle cx="428" cy="329" r="7" fill="#22c55e"/>
      <!-- humito -->
      <circle class="puff" cx="300" cy="52" r="9" fill="#cbd5d1"/>
      <circle class="puff d2" cx="318" cy="50" r="7" fill="#cbd5d1"/>
      <circle class="puff d3" cx="292" cy="54" r="6" fill="#cbd5d1"/>
    </g>

    <!-- chispas al golpear -->
    <g transform="translate(226 246)">
      <g class="spark">
        <path d="M0 0 L-16 -14 M0 0 L-20 2 M0 0 L-12 16 M0 0 L4 -20" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
        <circle cx="-22" cy="-8" r="3" fill="#fde047"/><circle cx="-6" cy="22" r="2.5" fill="#fde047"/>
      </g>
    </g>

    <!-- tornillo que salta -->
    <g transform="translate(206 352)">
      <g class="screw">
        <rect x="-3" y="-8" width="6" height="12" rx="1.5" fill="#94a3b8"/>
        <rect x="-6" y="-11" width="12" height="5" rx="2" fill="#64748b"/>
      </g>
    </g>

    <!-- robot técnico -->
    <g class="bob">
      <!-- piernas -->
      <rect x="128" y="320" width="14" height="30" rx="7" fill="#0f766e"/>
      <rect x="160" y="320" width="14" height="30" rx="7" fill="#0f766e"/>
      <rect x="120" y="344" width="28" height="12" rx="6" fill="var(--printer-line)"/>
      <rect x="154" y="344" width="28" height="12" rx="6" fill="var(--printer-line)"/>
      <!-- brazo que saluda -->
      <g class="arm-wave">
        <rect x="88" y="262" width="34" height="13" rx="6.5" fill="#0f766e"/>
        <circle cx="88" cy="268" r="9" fill="#ccfbf1" stroke="var(--printer-line)" stroke-width="3"/>
      </g>
      <!-- cuerpo -->
      <rect x="112" y="246" width="78" height="82" rx="24" fill="#14b8a6" stroke="var(--printer-line)" stroke-width="4"/>
      <rect x="128" y="266" width="46" height="26" rx="8" fill="#ccfbf1"/>
      <circle cx="140" cy="279" r="4" fill="#f97316"/><circle cx="152" cy="279" r="4" fill="#facc15"/><circle cx="164" cy="279" r="4" fill="#22c55e"/>
      <rect x="128" y="300" width="46" height="8" rx="4" fill="#0f766e"/>
      <!-- cabeza -->
      <line x1="151" y1="168" x2="151" y2="186" stroke="var(--printer-line)" stroke-width="4" stroke-linecap="round"/>
      <circle class="antenna" cx="151" cy="164" r="7" fill="#f59e0b" stroke="var(--printer-line)" stroke-width="3"/>
      <rect x="100" y="184" width="102" height="70" rx="26" fill="#ccfbf1" stroke="var(--printer-line)" stroke-width="4"/>
      <rect x="112" y="196" width="78" height="46" rx="16" fill="var(--screen)"/>
      <ellipse class="blink" cx="136" cy="216" rx="7" ry="9" fill="#5eead4"/>
      <ellipse class="blink" cx="166" cy="216" rx="7" ry="9" fill="#5eead4"/>
      <path d="M140 230 q11 8 22 0" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/>
      <circle cx="124" cy="229" r="4" fill="#f472b6" opacity=".55"/><circle cx="178" cy="229" r="4" fill="#f472b6" opacity=".55"/>
      <!-- gorra de técnico -->
      <path d="M104 196 q47 -40 94 0 z" fill="#f59e0b" stroke="var(--printer-line)" stroke-width="3"/>
      <rect x="160" y="190" width="44" height="8" rx="4" fill="#f59e0b" stroke="var(--printer-line)" stroke-width="3"/>
      <!-- brazo con llave -->
      <g class="arm-hit">
        <rect x="180" y="262" width="34" height="13" rx="6.5" fill="#0f766e"/>
        <circle cx="216" cy="268" r="9" fill="#ccfbf1" stroke="var(--printer-line)" stroke-width="3"/>
        <g transform="translate(216 268) rotate(-70)">
          <rect x="-5" y="-6" width="10" height="44" rx="5" fill="#94a3b8" stroke="var(--printer-line)" stroke-width="3"/>
          <path d="M-13 38 a13 13 0 1 0 26 0 l-6 0 l0 8 l-14 0 l0 -8 z" fill="#94a3b8" stroke="var(--printer-line)" stroke-width="3" stroke-linejoin="round"/>
        </g>
      </g>
    </g>

    <!-- globo de diálogo -->
    <g class="bubble">
      <rect x="28" y="88" width="176" height="52" rx="16" fill="var(--surface)" stroke="var(--printer-line)" stroke-width="3"/>
      <path d="M120 139 l10 16 l6 -16" fill="var(--surface)" stroke="var(--printer-line)" stroke-width="3" stroke-linejoin="round"/>
      <rect x="118" y="135" width="20" height="6" fill="var(--surface)"/>
      <text x="116" y="110" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-weight="700" font-size="13" fill="var(--ink)">¡Uy! Se atoró la capa…</text>
      <text x="116" y="128" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="12" fill="var(--ink-2)">ya casi la arreglo 🔧</text>
    </g>

    <!-- estrellitas flotando -->
    <g class="float" fill="#2dd4bf" opacity=".7">
      <path d="M560 70 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
      <path d="M40 300 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
    </g>
  </svg>

  <span class="code">ERROR 404 · PÁGINA NO ENCONTRADA</span>
  <h1>No encontramos <span>esta pagina</span>.</h1>
  <p class="sub">No encontramos lo que buscabas. Puedes vuelve al catálogo o cuéntanos qué necesitas y te lo imprimimos.</p>

  <div class="actions">
    <a class="btn btn-primary" id="home2" href="./">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Volver al catálogo
    </a>
    <a class="btn btn-wa" id="wa" href="https://wa.me/527721509872" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>
      Cotizar por WhatsApp
    </a>
  </div>
  <footer>© <span id="y"></span> 3D Catálogo · JCGA </footer>
</main>

<script>
  // En GitHub Pages esta página se muestra en cualquier ruta rota: calcula la dirección del catálogo.
  (function () {
    var base = "/";
    var seg = location.pathname.split("/")[1];
    if (/\.github\.io$/.test(location.hostname) && seg && seg !== "404.html") base = "/" + seg + "/";
    if (location.protocol === "file:") base = "index.html";
    document.getElementById("home1").href = base;
    document.getElementById("home2").href = base;
    var msg = "👋 ¡Hola, 3D Catálogo! Llegué a una página que no existe (" + location.pathname + "). ¿Me ayudan a encontrar o cotizar lo que busco?";
    document.getElementById("wa").href = "https://wa.me/527721509872?text=" + encodeURIComponent(msg);
    document.getElementById("y").textContent = new Date().getFullYear();
    // Respeta "reducir movimiento" también en las animaciones SVG (SMIL)
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) {
      try { document.getElementById("scene").pauseAnimations(); } catch (e) {}
    }
  })();
</script>
</body>
</html>
